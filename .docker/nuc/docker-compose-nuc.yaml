version: "3"

services: 
  setup_nuc:
    image: ghcr.io/droid-dataset/droid_nuc:panda
    environment:
      ROBOT_TYPE: panda
      LIBFRANKA_VERSION: 0.9.0
      NUC_IP: 192.168.10.4
      ROBOT_IP: 192.168.10.100
      LAPTOP_IP: 192.168.10.4
    volumes:
      - /home/panda/liris_droid/droid/misc/parameters.py:/app/droid/misc/parameters.py
      - /home/panda/liris_droid/config/panda/franka_hardware.yaml:/app/droid/fairo/polymetis/polymetis/conf/robot_client/franka_hardware.yaml
      - /home/panda/liris_droid/config/panda/franka_panda.yaml:/app/droid/fairo/polymetis/polymetis/conf/robot_model/franka_panda.yaml
      - /home/panda/liris_droid/config/panda/franka_hand.yaml:/app/droid/fairo/polymetis/polymetis/conf/gripper/franka_hand.yaml
    build: 
      context: ../../
      dockerfile: .docker/nuc/Dockerfile.nuc
      args:
        ROBOT_TYPE: panda
        LIBFRANKA_VERSION: 0.9.0
        NUC_IP: 192.168.10.4
        ROBOT_IP: 192.168.10.100
        LAPTOP_IP: 192.168.10.4
    devices:
      - "/dev:/dev"
    privileged: true
    network_mode: "host"
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: 102400
    deploy:
      restart_policy: 
        condition: any

